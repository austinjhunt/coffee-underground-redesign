# Publishes the static site to GitHub Pages on every push to main, and once a day
# so the Events page's list of upcoming shows (built from the CU Google Calendar) stays current.
# No build step for the pages: it copies the site files into _site, adds redirect pages
# (Pages ignores _redirects), writes assets/data/events.json, checks local links, then deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # 5am Eastern (4am in winter)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage site files
        run: |
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github' --exclude '_site' \
            --exclude 'docs' --exclude 'scripts' \
            --exclude 'CLAUDE.md' --exclude 'README.md' --exclude '_redirects' \
            --exclude '.DS_Store'

      - name: Turn _redirects into redirect pages
        # e.g. "/blank /about-cu/ 301" -> _site/blank/index.html pointing at ../about-cu/
        run: |
          python3 - <<'EOF'
          import os
          for line in open("_redirects"):
              parts = line.split()
              if len(parts) < 2 or parts[0].startswith("#"):
                  continue
              src, dst = parts[0].strip("/"), parts[1]
              if not src:
                  continue
              out = os.path.join("_site", src, "index.html")
              if os.path.exists(out):
                  continue
              rel = os.path.relpath(dst.strip("/") or ".", src) + "/"
              os.makedirs(os.path.dirname(out), exist_ok=True)
              open(out, "w").write(
                  f'<!doctype html><meta charset="utf-8"><title>Redirecting</title>'
                  f'<meta http-equiv="refresh" content="0; url={rel}">'
                  f'<link rel="canonical" href="{rel}"><a href="{rel}">Continue</a>\n')
              print(f"/{src}/ -> {rel}")
          EOF

      - name: Keep the preview out of search results
        # Demo copy only: the owner's content shouldn't be indexed at this address. The repo HTML stays clean.
        run: |
          python3 - <<'EOF'
          import pathlib, re
          tag = '<meta name="robots" content="noindex">'
          for f in pathlib.Path("_site").rglob("*.html"):
              s = f.read_text(encoding="utf-8")
              if tag in s:
                  continue
              s, n = re.subn(r'(<meta charset="utf-8">)', r'\1\n' + tag, s, count=1, flags=re.I)
              if not n:
                  s = re.sub(r'(<head[^>]*>)', r'\1\n' + tag, s, count=1, flags=re.I)
              f.write_text(s, encoding="utf-8")
              print("noindex", f)
          EOF

      - name: Build upcoming events from Google Calendar
        # If Google is unreachable, deploy anyway; the Events page falls back to a calendar link.
        continue-on-error: true
        run: |
          pip install --quiet icalendar recurring-ical-events
          python3 scripts/build-events.py _site/assets/data/events.json

      - name: Check local links
        run: python3 scripts/check-links.py _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
